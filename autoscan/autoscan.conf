# === autoscan — konfiguracja ===
# Skopiuj obok autoscan.sh i dostosuj. Flagi z linii poleceń mają pierwszeństwo.

# Zgoda na skan w trybie automatycznym (po wpięciu kabla). 1 = tak.
# UWAGA: ustaw 1 TYLKO jeśli ten PocketTerm wpinasz do WŁASNYCH sieci/serwerów.
AUTHORIZED=0

# Kto przeprowadza audyt (ląduje w nagłówku raportu)
AUDITOR="altgreen64"

# Gdzie zapisywać raporty
OUTDIR="$HOME/audyt-raporty"

# Kultura/zasięg nmap:  -T2 cicho | -T3 normalnie | -T4 szybko
NMAP_TIMING="-T3"
# Zakres portów:  "--top-ports 1000" (szybko) | "-p-" (wszystkie, wolno)
NMAP_PORTS="--top-ports 1000"

# ettercap (MITM) — AKTYWNE. 0 = wyłączone (zalecane), 1 = włączone
DO_MITM=0

# Słownik dla dirb
DIRB_WORDLIST="/usr/share/dirb/wordlists/common.txt"
